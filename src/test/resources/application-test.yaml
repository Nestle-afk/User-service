spring:
  datasource:
    url: jdbc:tc:postgresql:13:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: schema
    drop-first: true

  cache:
    type: redis

  data:
    redis:
      timeout: 2s
