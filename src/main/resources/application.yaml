spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://localhost:5433/user_service
    username: "postgres"
    password: "1"
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  liquibase:
    enabled: true
    drop-first: true

  cache:
      type: redis
      redis:
        time-to-live: 3600000
        cache-null-values: false
        key-prefix: "user_service:"
        use-key-prefix: true
