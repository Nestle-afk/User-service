name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify -Dspring.profiles.active=test -Dsettings.security=skip

      - name: Run Tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Nestle-afk_User-service
            -Dsonar.organization=nestle-afk
            -Dsonar.java.binaries=target/classes

      - name: Build Docker image
        run: docker build -t user-service:latest .

      - name: Save Docker image as artifact
        run: |
          docker save user-service:latest -o user-service-image.tar
        continue-on-error: true
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-docker-image
          path: user-service-image.tar
        continue-on-error: true
