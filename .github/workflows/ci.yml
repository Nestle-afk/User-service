name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Show environment info
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Maven Version ==="
          mvn -version
          echo "=== Current Directory ==="
          pwd
          echo "=== Disk Usage ==="
          df -h
          echo "=== Memory Info ==="
          free -h

      - name: Build with Maven (with logs)
        run: |
          echo "=== Starting Maven Build at $(date) ==="
          mvn -B clean package -e -X -V | tee maven_build.log
          echo "=== Maven Build Finished at $(date) ==="
          echo "=== Listing target directory ==="
          ls -lah target || echo "No target directory found"
        shell: bash

      - name: Upload Maven build log
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: maven_build.log
        continue-on-error: true

      - name: Run Tests
        run: mvn test -B -e | tee maven_test.log

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-log
          path: maven_test.log
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Nestle-afk_User-service
            -Dsonar.organization=nestle-afk
            -Dsonar.java.binaries=target/classes

      - name: Build Docker image
        run: docker build -t user-service:latest .

      - name: Save Docker image as artifact
        run: |
          docker save user-service:latest -o user-service-image.tar
        continue-on-error: true

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-docker-image
          path: user-service-image.tar
        continue-on-error: true
